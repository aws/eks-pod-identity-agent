# Default values for eks-pod-identity-agent.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

daemonsets:
  cloud:
    create: true
    volumes:
    - name: jwk-cache
      emptyDir: {}
    volumeMounts:
    - mountPath: /var/lib/eks-pod-identity-agent
      name: jwk-cache
  hybrid:
    create: false
    nameSuffix: hybrid
    additionalArgs:
      "--rotate-credentials": "true"
    volumes:
    - name: aws-credentials
      hostPath:
        path: /eks-hybrid/.aws
        type: Directory
    volumeMounts:
    - mountPath: /root/.aws
      name: aws-credentials
      readOnly: true
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: "kubernetes.io/os"
                  operator: In
                  values:
                    - linux
                - key: "kubernetes.io/arch"
                  operator: In
                  values:
                    - amd64
                    - arm64
                - key: "eks.amazonaws.com/compute-type"
                  operator: In
                  values:
                    - hybrid
                - key: os.bottlerocket.aws/variant
                  operator: DoesNotExist
                - key: os.bottlerocket.aws/version
                  operator: DoesNotExist
  hybrid-bottlerocket:
    create: false
    nameSuffix: hybrid-bottlerocket
    additionalArgs:
      "--rotate-credentials": "true"
    additionalSecurityContext:
      seLinuxOptions:
        type: spc_t
    volumes:
    - name: aws-credentials
      hostPath:
        path: /var/eks-hybrid/.aws
        type: Directory
    volumeMounts:
    - mountPath: /root/.aws
      name: aws-credentials
      readOnly: true
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: "kubernetes.io/os"
                  operator: In
                  values:
                    - linux
                - key: "kubernetes.io/arch"
                  operator: In
                  values:
                    - amd64
                    - arm64
                - key: "eks.amazonaws.com/compute-type"
                  operator: In
                  values:
                    - hybrid
                - key: os.bottlerocket.aws/variant
                  operator: Exists
                - key: os.bottlerocket.aws/version
                  operator: Exists

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: "kubernetes.io/os"
              operator: In
              values:
                - linux
            - key: "kubernetes.io/arch"
              operator: In
              values:
                - amd64
                - arm64
            - key: "eks.amazonaws.com/compute-type"
              operator: NotIn
              values:
                - fargate
                - hybrid
                - auto

agent:
  additionalArgs:
    "-v": "trace"
  advertiseProxyPort: true
  command: "['/go-runner', '/eks-pod-identity-agent', 'server']"
  livenessEndpoint: /healthz
  probePort: 2703
  readinessEndpoint: /readyz


metrics:
  enabled: false
  port: 2705
  path: /metrics
  extraLabels:
    prometheus.io/scrape: "true"
    prometheus.io/port: "2705"
  serviceMonitor:
    enabled: false
    extraLabels: {}
    interval: "15s"

clusterName: EKS_CLUSTER_NAME

env:
  AWS_REGION: AWS_REGION_NAME

fullnameOverride: "eks-pod-identity-agent"

image:
  containerRegistry: "602401143452.dkr.ecr.us-west-2.amazonaws.com"
  pullPolicy: Always
  region: us-west-2
  tag: v0.1.20

  # Set to use custom image
  # override: "repo/org/image:tag"
  override:

imagePullSecrets: []

init:
  additionalArgs:
    "-v": "trace"
  command: "['/go-runner', '/eks-pod-identity-agent', 'initialize']"
  # Specifies whether initContainer should be created
  create: true

nameOverride: "eks-pod-identity-agent"

nodeSelector: {}

podAnnotations:
  prometheus.io/port: '2705'
  prometheus.io/scrape: 'true'

podLabels: {}

priorityClassName: system-node-critical

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

serviceAccount:
  # Whether a ServiceAccount manifest should be created and assigned to the pod.
  # Default false preserves the chart's current rendered output: no SA is created
  # and no serviceAccountName is set on the pod, so admission resolves it to the
  # namespace's "default" ServiceAccount.
  create: false
  # Annotations to add to the ServiceAccount when create is true (e.g. for
  # IRSA / EKS Pod Identity associations on the agent itself, if desired).
  annotations: {}
  # The ServiceAccount name to use.
  #   create=true,  name=""       -> chart-managed name (fullname template)
  #   create=true,  name=<custom> -> create with the given name
  #   create=false, name=<custom> -> reference a pre-existing SA in the namespace
  #   create=false, name=""       -> omit serviceAccountName (default behaviour)
  name: ""

tolerations:
  - operator: Exists

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: "10%"
