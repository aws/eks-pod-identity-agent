{{- $top := . -}}
{{- /*
Whether this install gets workload identity; see the helper and "Workload identity" in
the chart README.
*/ -}}
{{- $enableWorkloadIdentity := eq (include "eks-pod-identity-agent.enableWorkloadIdentity" $top) "true" -}}
{{- range $_, $daemonset := .Values.daemonsets -}}
{{- if $daemonset.create -}}
{{- $valuesDict := dict "nameSuffix" $daemonset.nameSuffix "Values" $top.Values "Release" $top.Release "Chart" $top.Chart -}}
{{- $selectorLabels := include "eks-pod-identity-agent.selectorLabels" $valuesDict -}}
{{- $affinity := default $top.Values.affinity $daemonset.affinity -}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "eks-pod-identity-agent.fullname" $valuesDict }}
  namespace: {{ $top.Release.Namespace }}
  labels:
    {{- include "eks-pod-identity-agent.labels" $valuesDict | nindent 4}}
spec:
  updateStrategy:
    {{- toYaml $top.Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- $selectorLabels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $selectorLabels | nindent 8 }}
        {{- with $top.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $top.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: true
      priorityClassName: {{ $top.Values.priorityClassName }}
      {{- with (include "eks-pod-identity-agent.serviceAccountName" $top) }}
      serviceAccountName: {{ . }}
      {{- end }}
      hostNetwork: true
      {{- if $enableWorkloadIdentity }}
      {{- /* Attestation needs the peer's PID: without it SO_PEERCRED reports 0. */}}
      hostPID: true
      {{- end }}
      terminationGracePeriodSeconds: 30
      {{- with $top.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $top.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $top.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $top.Values.init.create }}
      initContainers:
        - name: {{ $top.Chart.Name }}-init
          image: {{ include "eks-pod-identity-agent.image" $ }}
          imagePullPolicy: {{ $top.Values.image.pullPolicy }}
          command: {{ $top.Values.init.command }}
          {{- if $top.Values.init.additionalArgs }}
          args:
            {{- range $key, $value := $top.Values.init.additionalArgs }}
            - {{ $key | quote }}
            - {{ $value | quote }}
            {{- end }}
          {{- end }}
          securityContext:
            privileged: true
      {{- end }}
      containers:
        - name: {{ $top.Chart.Name }}
          image: {{ include "eks-pod-identity-agent.image" $ }}
          imagePullPolicy: {{ $top.Values.image.pullPolicy }}
          command: {{ $top.Values.agent.command }}
          args:
            - "--port"
            - "80"
            - "--cluster-name"
            - {{ $top.Values.clusterName | quote }}
            - "--probe-port"
            - {{ $top.Values.agent.probePort | quote }}
            {{- if $top.Values.metrics.enabled }}
            - "--metrics-port"
            - {{ $top.Values.metrics.port | quote }}
            {{- end }}
            {{- if $enableWorkloadIdentity }}
            {{- /* One token: pflag reads a bare bool flag as true and ignores a separate value. */}}
            - "--enable-workload-identity=true"
            {{- end }}
            {{- range $key, $value := $top.Values.agent.additionalArgs }}
            - {{ $key | quote }}
            - {{ $value | quote }}
            {{- end }}
            {{- range $key, $value := $daemonset.additionalArgs }}
            - {{ $key | quote }}
            - {{ $value | quote }}
            {{- end }}
          ports:
            {{- if $top.Values.agent.advertiseProxyPort }}
            - containerPort: 80
              protocol: TCP
              name: proxy
            {{- end }}
            - containerPort: {{ $top.Values.agent.probePort }}
              protocol: TCP
              name: probes-port
           {{- if $top.Values.metrics.enabled }}
            - containerPort: {{ $top.Values.metrics.port }}
              protocol: TCP
              name: metrics
            {{- end }}
          env:
          {{- range $key, $value := $top.Values.env }}
          - name: {{ $key }}
            value: {{ $value | quote }}
          {{- end }}
          {{- if contains "-iso" $top.Values.env.AWS_REGION }}
          - name: AWS_CA_BUNDLE
            value: /etc/pki/tls/certs/ca-bundle.crt
          {{- end }}
          {{- if or (contains "-iso" $top.Values.env.AWS_REGION) $enableWorkloadIdentity $daemonset.volumeMounts }}
          volumeMounts:
          {{- end }}
          {{- if contains "-iso" $top.Values.env.AWS_REGION }}
          - name: ca-bundle
            mountPath: /etc/pki/tls/certs/ca-bundle.crt
            readOnly: true
          {{- end }}
          {{- if $enableWorkloadIdentity }}
          {{- /* The agent binds its socket here; the CSI driver sidecar publishes it. */}}
          - name: workload-identity-socket-dir
            mountPath: /var/run/secrets/pods.eks.amazonaws.com/workloadidentity
          {{- end }}
          {{- if $daemonset.volumeMounts }}
          {{- toYaml $daemonset.volumeMounts | nindent 10}}
          {{- end }}
          securityContext:
            capabilities:
              add:
                - CAP_NET_BIND_SERVICE
            {{- with $daemonset.additionalSecurityContext }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml $top.Values.resources | nindent 12 }}
          {{- if $top.Values.agent.livenessEndpoint }}
          livenessProbe:
            failureThreshold: 3
            httpGet:
              host: localhost
              path: {{ $top.Values.agent.livenessEndpoint }}
              port: probes-port
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 10
          {{- end }}
          {{- if $top.Values.agent.readinessEndpoint }}
          readinessProbe:
            failureThreshold: 30
            httpGet:
              host: localhost
              path: {{ $top.Values.agent.readinessEndpoint }}
              port: probes-port
              scheme: HTTP
            initialDelaySeconds: 1
            timeoutSeconds: 10
          {{- end }}
        {{- if $enableWorkloadIdentity }}
        {{- /*
        The workload identity CSI node plugin, a separate binary in the agent's image. It is
        privileged, because Kubernetes allows Bidirectional propagation only there, so the
        agent above does not have to be. Each kubelet mountPath must equal its host path.
        See "Workload identity" in the chart README.
        */}}
        - name: {{ $top.Chart.Name }}-csi-driver
          image: {{ include "eks-pod-identity-agent.image" $ }}
          imagePullPolicy: {{ $top.Values.image.pullPolicy }}
          {{- /* Not a values knob: this container is privileged. */}}
          command: ['/go-runner', '/eks-pod-identity-csi-driver']
          args:
            - "-v"
            - "info"
          env:
          {{- /* The CSI node ID, from the downward API. */}}
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          volumeMounts:
          - name: workload-identity-socket-dir
            mountPath: /var/run/secrets/pods.eks.amazonaws.com/workloadidentity
            readOnly: true
          - name: csi-plugin-dir
            mountPath: /var/lib/kubelet/plugins/spiffe.csi.eks.amazonaws.com
          - name: csi-plugin-registration-dir
            mountPath: /var/lib/kubelet/plugins_registry
          {{- /* Bidirectional, so the kubelet sees the bind mounts made in this container. */}}
          - name: kubelet-pods-dir
            mountPath: /var/lib/kubelet/pods
            mountPropagation: Bidirectional
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          resources:
            {{- /* Nil-safe: helm upgrade --reuse-values keeps an older chart's values, which have no csiDriver. */}}
            {{- toYaml (default (dict) (default (dict) $top.Values.csiDriver).resources) | nindent 12 }}
        {{- end }}
      {{- if or (contains "-iso" $top.Values.env.AWS_REGION) $enableWorkloadIdentity $daemonset.volumes }}
      volumes:
      {{- end }}
        {{- if contains "-iso" $top.Values.env.AWS_REGION }}
        - name: ca-bundle
          hostPath:
            path: /etc/pki/tls/certs/ca-bundle.crt
            type: File
        {{- end }}
        {{- if $enableWorkloadIdentity }}
        {{- /*
        Workload identity CSI volumes. The hostPath types are deliberate; see the chart
        README.
        */}}
        - name: workload-identity-socket-dir
          hostPath:
            path: /var/run/secrets/pods.eks.amazonaws.com/workloadidentity
            type: DirectoryOrCreate
        {{- /* Holds the CSI plugin socket. */}}
        - name: csi-plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/spiffe.csi.eks.amazonaws.com
            type: DirectoryOrCreate
        {{- /* Watched by the kubelet for plugin registration. */}}
        - name: csi-plugin-registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
        {{- /* Where every publish target lives. Strict Directory, unlike the two above. */}}
        - name: kubelet-pods-dir
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        {{- end }}
        {{- if $daemonset.volumes }}
        {{- toYaml $daemonset.volumes | nindent 8}}
        {{- end }}
{{ end }}
{{ end }}