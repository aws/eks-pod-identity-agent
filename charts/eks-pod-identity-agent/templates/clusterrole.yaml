{{- if .Values.podLiveness.enabled -}}
{{- $saName := default "default" (include "eks-pod-identity-agent.serviceAccountName" .) -}}
# The pod-liveness feature lets a background credential refresh skip pods that
# have terminated. The agent watches only the pods on its own node, so it needs
# read access to pods. get, list and watch are what a client-go informer uses to
# list the initial set and then follow changes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "eks-pod-identity-agent.fullname" (dict "Values" .Values "Release" .Release "Chart" .Chart) }}-pod-liveness
  labels:
    {{- include "eks-pod-identity-agent.labels" (dict "Values" .Values "Release" .Release "Chart" .Chart) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "eks-pod-identity-agent.fullname" (dict "Values" .Values "Release" .Release "Chart" .Chart) }}-pod-liveness
  labels:
    {{- include "eks-pod-identity-agent.labels" (dict "Values" .Values "Release" .Release "Chart" .Chart) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "eks-pod-identity-agent.fullname" (dict "Values" .Values "Release" .Release "Chart" .Chart) }}-pod-liveness
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
